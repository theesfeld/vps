[workspace]
resolver = "2"
members = ["crates/vps-protocol", "crates/vpsd", "crates/vps"]
default-members = ["crates/vps", "crates/vpsd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["tj"]
rust-version = "1.85"
description = "Native VPS TTY: local window, remote PTY, SSH tunnel only"

[workspace.dependencies]
vps-protocol = { path = "crates/vps-protocol" }
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
nix = { version = "0.30", features = ["term", "process", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = { version = "0.8", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
